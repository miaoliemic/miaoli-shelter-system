<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>節點畫布</title>
    <script>
      window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
    </script>
    <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
        }
      }
    </script>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      #status {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
        font: 12px/1.4 system-ui, sans-serif; color: #555; background: #fff;
        border: 1px solid #ddd; border-radius: 6px; padding: 3px 10px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">載入中…</div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import * as X from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";

      const { Excalidraw, restoreElements, serializeAsJSON, getSceneVersion, CaptureUpdateAction } = X;
      const statusEl = document.getElementById("status");
      const now = () => new Date().toLocaleTimeString("zh-TW", { hour12: false });
      const setStatus = (t) => (statusEl.textContent = t);

      let api = null;
      let version = 0; // 伺服器上的檔案版本
      let latestRemote = 0;
      let baseline = -1; // 最後一次和檔案一致時的場景版本
      let applyingRemote = false;
      let saving = false;
      let timer = null;

      async function fetchScene() {
        const r = await fetch("/scene", { cache: "no-store" });
        return r.json();
      }

      function onChange(elements) {
        const sv = getSceneVersion(elements);
        if (baseline === -1 || applyingRemote) { baseline = sv; return; }
        if (sv === baseline) return; // 只是捲動、選取
        setStatus("編輯中…");
        clearTimeout(timer);
        timer = setTimeout(save, 600);
      }

      async function save() {
        if (saving) { timer = setTimeout(save, 300); return; }
        saving = true;
        try {
          const elements = api.getSceneElements();
          const sv = getSceneVersion(elements);
          const body = serializeAsJSON(elements, api.getAppState(), api.getFiles(), "local");
          const r = await fetch("/scene?base=" + version, { method: "PUT", body, headers: { "content-type": "application/json" } });
          if (r.status === 409) {
            await pullRemote("Claude 剛好也改了畫布，你最後幾秒的修改沒存到，請再做一次");
            return;
          }
          if (!r.ok) throw new Error(await r.text());
          version = (await r.json()).version;
          baseline = sv;
          setStatus("已存檔 " + now());
        } catch (err) {
          setStatus("存檔失敗：" + err.message);
        } finally {
          saving = false;
        }
        if (latestRemote > version) pullRemote();
      }

      async function pullRemote(message) {
        const data = await fetchScene();
        applyingRemote = true;
        const elements = restoreElements(data.scene.elements, null, { repairBindings: true });
        api.updateScene({ elements, captureUpdate: CaptureUpdateAction?.IMMEDIATELY });
        version = data.version;
        clearTimeout(timer);
        setTimeout(() => {
          baseline = getSceneVersion(api.getSceneElements());
          applyingRemote = false;
        }, 100);
        if (message) api.setToast({ message, closable: true, duration: 8000 });
        else api.setToast({ message: "Claude 已更新畫布（Ctrl+Z 可以復原）", duration: 4000 });
        setStatus("已同步 " + now());
      }

      const initial = await fetchScene();
      version = latestRemote = initial.version;
      document.title = initial.name.replace(/\.excalidraw$/, "") + "｜節點畫布";

      const events = new EventSource("/events");
      events.onmessage = (ev) => {
        latestRemote = JSON.parse(ev.data).version;
        if (api && !saving && latestRemote > version) pullRemote();
        setStatus("已連線 " + now());
      };
      events.onerror = () => setStatus("和伺服器斷線，重新連線中…");

      createRoot(document.getElementById("app")).render(
        React.createElement(Excalidraw, {
          excalidrawAPI: (a) => {
            api = a;
            setTimeout(() => a.scrollToContent(undefined, { fitToContent: true }), 300); // 開啟時看到整張圖
          },
          initialData: {
            elements: initial.scene.elements,
            appState: { ...(initial.scene.appState ?? {}), collaborators: new Map() },
            files: initial.scene.files,
            scrollToContent: true,
          },
          langCode: "zh-TW",
          onChange,
        }),
      );
      setStatus("已載入 " + initial.name);
    </script>
  </body>
</html>
