<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收容所物資</title>
<style>
:root{
  --bg:#F4F3EE;--card:#FFFFFF;--text:#1E2A36;--soft:#5B6573;--muted:#8A93A0;--line:#E2E0D8;
  --green:#2B7A3D;--green-bg:#E3F1E6;--blue:#1F5FA8;--blue-bg:#E4EEF9;--amber:#8A5300;--amber-bg:#FFF1D6;
  --red:#B42318;--red-bg:#FDE7E5;--chip:#ECEAE3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15191E;--card:#1F252C;--text:#E8EAED;--soft:#AEB6C0;--muted:#7D8792;--line:#323A43;
  --green:#6BC283;--green-bg:#1E3325;--blue:#7DB2EE;--blue-bg:#1B2B3E;--amber:#F2B451;--amber-bg:#3A2C12;
  --red:#F2867B;--red-bg:#3D1E1B;--chip:#2A3139;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding-bottom:180px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:8px}
.title h1{font-size:19px;font-weight:700;flex:1}
.sub{font-size:13px;color:var(--soft);margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.seg button.on[data-mode="in"]{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on[data-mode="out"]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button.on[data-mode="count"]{background:var(--amber);border-color:var(--amber);color:#fff}
.seg button:disabled{opacity:.35}
.hint{font-size:13px;color:var(--soft);margin-top:8px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.scan{height:42px;padding:0 14px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chips button{padding:5px 12px;border-radius:999px;background:var(--chip);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--text);color:var(--bg)}
.recipient{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;gap:8px}
.recipient.none{background:var(--amber-bg);color:var(--amber)}
.recipient .who{flex:1;min-width:0}
.recipient b{font-size:17px}
.recipient small{display:block;font-size:12px;opacity:.85}
.recipient button{padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px;font-weight:700;white-space:nowrap}
.focus{margin:12px 16px 0;padding:16px;border-radius:16px;background:var(--card);border:2px solid var(--text)}
.focus h2{font-size:22px}
.focus .big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.focus .big button{padding:14px 0;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line);background:var(--bg)}
.focus .big button.on[data-mode="in"]{background:var(--green);color:#fff;border-color:var(--green)}
.focus .big button.on[data-mode="out"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.showall{display:block;margin:10px auto 0;color:var(--soft);font-size:14px;text-decoration:underline}
.list{margin:12px 16px 0;background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row.low{background:var(--amber-bg)}
.row.picked{box-shadow:inset 4px 0 0 var(--accent)}
.row .top{display:flex;align-items:center;gap:8px}
.row .name{font-weight:700;font-size:17px;flex:1}
.row .stock{font-size:13px;color:var(--soft)}
.row.low .stock,.row.low .name{color:var(--amber)}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
.unit{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;line-height:1}
.qty{width:72px;height:44px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:700}
.diff{font-size:13px;margin-left:auto}
.err{font-size:13px;color:var(--red);margin-top:6px}
.addnew{display:block;width:100%;padding:14px;text-align:left;color:var(--blue);font-weight:700;border-top:1px solid var(--line)}
.recent{margin:16px 16px 0;font-size:14px;color:var(--soft)}
.recent h3{font-size:14px;margin-bottom:4px;color:var(--text)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .sum{flex:1;font-size:15px;color:var(--soft)}
.bar .sum b{color:var(--text)}
.go{padding:12px 20px;border-radius:12px;color:#fff;font-weight:700;font-size:16px;background:var(--accent)}
.go:disabled{opacity:.4}
.demo{max-width:528px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.demo button{font-size:12px;padding:2px 8px;border-radius:999px;border:1px dashed var(--muted);color:var(--soft)}
.sheet-bg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{font-size:19px;margin-bottom:10px}
.sheet .line{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.sheet .line small{color:var(--soft)}
.sheet .acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.sheet .acts button{padding:13px 0;border-radius:12px;font-weight:700;border:1px solid var(--line)}
.sheet .acts .go{border:none}
.sheet label{display:block;font-size:14px;color:var(--soft);margin-top:10px}
.sheet input,.sheet select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;margin-top:4px}
.ok{color:var(--green)} .bad{color:var(--red)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw}
.rcard{margin:12px 16px 0;padding:18px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rcard h2{font-size:26px;line-height:1.3}
.rcard .meta{color:var(--soft);font-size:14px;margin-top:4px}
.rcard.void{background:var(--red-bg);border-color:var(--red);color:var(--red);text-align:center}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700;margin-top:10px}
.badge.在所{background:var(--green-bg);color:var(--green)}
.badge.外出{background:var(--amber-bg);color:var(--amber)}
.badge.未返,.badge.已離所{background:var(--red-bg);color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{padding:2px 10px;border-radius:999px;background:var(--chip);font-size:13px}
.ract{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 16px 0}
.ract button{padding:16px 0;border-radius:14px;font-size:18px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.ract .main{background:var(--blue);border-color:var(--blue);color:#fff;grid-column:1 / -1}
.ract .warn{color:var(--red)}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.hours button{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.form{margin:12px 16px 0;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.form h2{font-size:20px}
.form label{display:block;font-size:14px;color:var(--soft);margin-top:12px}
.form label b{color:var(--red)}
.form input,.form textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;margin-top:4px;font:inherit;color:inherit}
.form textarea{min-height:70px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chkline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;color:var(--text)}
.chkline input{width:22px;height:22px;min-height:0;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:-4px 0 10px;padding:3px;border-radius:12px;background:var(--chip)}
.tabs button{padding:7px 0;border-radius:9px;font-weight:700;font-size:15px;color:var(--soft)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
.stat{padding:10px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:var(--soft)}
.stat.alert{background:var(--red-bg);border-color:var(--red)}.stat.alert b{color:var(--red)}
.stat.warn{background:var(--amber-bg)}.stat.warn b{color:var(--amber)}
.sec{margin:16px 16px 6px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.sec small{font-weight:400;color:var(--soft)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px}
.chips2 span{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.evt{display:block;width:calc(100% - 32px);margin:0 16px 8px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.evt.緊急{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.evt.高{box-shadow:inset 4px 0 0 var(--amber)}
.evt .t{font-weight:700;font-size:16px}
.evt .m{font-size:13px;color:var(--soft);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.sev{padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip)}
.sev.緊急{background:var(--red);color:#fff}.sev.高{background:var(--amber-bg);color:var(--amber)}
.own{font-weight:700}.own.free{color:var(--red)}.own.mine{color:var(--green)}
.plist{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow .n{flex:1;font-weight:700}
.prow button{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.pre{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px}
.blocked{margin:60px 24px;text-align:center}
.blocked h2{font-size:20px;margin-bottom:8px}
.blocked p{color:var(--soft)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden>
  <div class="in"><div class="sum" id="sum"></div><button class="go" id="go">確認登記</button></div>
  <div class="demo" id="demo"></div>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定：LIFF ID 與 API 網址填入後改用真資料；未填時用下方的模擬資料（原型） =====
const CONFIG = { liffId: "2012049994-PV1Y181j", apiUrl: "https://hook.us2.make.com/7t41m917ehb6cazsap56tygu0am7gi9x",
                 // 本所畫面（狀況、事件、整備）用另一個 Make 情境（14）
                 opsUrl: "https://hook.us2.make.com/8pb0qpcoclm3jf62paodw1d9wxfo0esj" };
// 只有在正式網址（GitHub Pages）才啟動 LIFF；本機預覽時略過，直接用模擬資料
const IN_LIFF_HOST = location.hostname.endsWith("github.io");

const MODES = { in: "入庫", out: "發放", count: "盤點" };
const ACCENT = { in: "var(--green)", out: "var(--blue)", count: "var(--amber)" };

// ===== 模擬後端（原型用）。正式版由 Make 情境 13 提供相同格式的回應 =====
const mock = {
  me: { name: "佳璇", role: "管理者（收容所負責人）", onDuty: true,
        opening: "【模擬】清華里活動中心", event: "【模擬】2026-10 風災" },
  items: [
    { id: "i1", code: "SUP-7K2QX", name: "飲用水", cat: "飲用水", unit: "瓶", pack: "箱", per: 24, stock: 216, safety: 48 },
    { id: "i2", code: "SUP-M4TZ8", name: "泡麵", cat: "食品", unit: "碗", pack: "箱", per: 12, stock: 60, safety: 24 },
    { id: "i3", code: "SUP-R9WD2", name: "餅乾", cat: "食品", unit: "包", pack: "箱", per: 30, stock: 90, safety: 30 },
    { id: "i4", code: "SUP-H3NV6", name: "衛生紙", cat: "衛生用品", unit: "包", pack: "串", per: 12, stock: 72, safety: 24 },
    { id: "i5", code: "SUP-Q8LJ5", name: "成人紙尿褲", cat: "衛生用品", unit: "片", pack: "包", per: 10, stock: 30, safety: 20 },
    { id: "i6", code: "SUP-B6XC7", name: "口罩", cat: "醫療", unit: "片", pack: "盒", per: 50, stock: 300, safety: 100 },
    { id: "i7", code: "SUP-T2FY9", name: "暖暖包", cat: "防寒", unit: "片", pack: "盒", per: 10, stock: 38, safety: 50 },
    { id: "i8", code: "SUP-W5KP3", name: "毛毯", cat: "寢具", unit: "條", pack: "", per: 1, stock: 30, safety: 10 },
  ],
  residents: { "MLS-W8AGZ": { id: "r1", name: "測試王小明", note: "長者・高齡者", inShelter: true },
               "MLS-K7PQ2": { id: "r2", name: "測試林阿姨", note: "在所", inShelter: true },
               "MLS-RXKK3": { id: "r3", name: "測試陳美華", note: "已離所", inShelter: false } },
  // 居民頁面（?r=MLS-xxxxx）用的號碼牌
  tags: { "MLS-W8AGZ": "r1", "MLS-K7PQ2": "r2", "MLS-RXKK3": "void", "MLS-NEW01": "blank" },
  people: { r1: { id: "r1", name: "測試王小明", age: "長者", care: "高齡者", status: "在所", back: "", area: "A 區 3 號床" },
            r2: { id: "r2", name: "測試林阿姨", age: "成人", care: "", status: "外出", back: new Date(Date.now() + 2 * 3600e3).toISOString(), area: "" } },
  recent: [
    { t: "10:42", text: "衛生紙 發放 1 包・王大明" },
    { t: "10:35", text: "成人紙尿褲 入庫 30 片" },
    { t: "10:20", text: "飲用水 入庫 2 箱" },
  ],
  seen: new Set(),
};
const wait = ms => new Promise(r => setTimeout(r, ms));

// ===== 正式後端：Make 情境 13（物資 API）。用表單格式送出，瀏覽器不會先送 CORS 預檢 =====
class ApiError extends Error { constructor(code) { super(code); this.code = code; } }
async function post(fields, url) {
  // 送 Access Token：每次開啟 LIFF 都會更新、有效 12 小時；Make 會向 LINE 確認它屬於本系統並取得使用者編號
  const token = liff.getAccessToken();
  if (!token) throw new ApiError("no_token");
  const body = new URLSearchParams({ ...fields, t: token });
  const res = await fetch(url || CONFIG.apiUrl, { method: "POST", body });
  let data;
  try { data = await res.json(); } catch (e) { throw new ApiError("server"); }
  if (!data.ok) throw new ApiError(data.error || "server");
  return data;
}
// Notion 欄位值（Make 原樣轉出的 properties_value）轉成一般文字或數字
const txt = v => Array.isArray(v) ? v.map(x => x.plain_text || (x.text && x.text.content) || x.name || "").join("") : (v && v.name) || (typeof v === "string" ? v : "");
const num = v => typeof v === "number" ? v : (v && typeof v.number === "number" ? v.number : 0);
const photo = v => { const f = Array.isArray(v) && v[0]; return f ? ((f.file && f.file.url) || (f.external && f.external.url) || f.url || "") : ""; };
// 物資代碼：SUP- 加 5 碼（去掉容易看錯的 0、O、1、I），印在物資標籤 QR 上
function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = new Uint32Array(5);
  crypto.getRandomValues(r);
  return "SUP-" + Array.from(r, x => A[x % A.length]).join("");
}
const real = {
  async load() {
    const d = await post({ a: "load" });
    const items = (d.items || []).map(r => {
      const p = r.properties_value || {};
      const unit = txt(p["單位"]) || "個", pack = txt(p["包裝單位"]);
      return { id: r.id, code: txt(p["物資代碼"]), name: txt(p["品名"]), cat: txt(p["類別"]) || "其他",
               unit, pack: pack === unit ? "" : pack, per: num(p["每包裝數量"]) || 1,
               stock: num(p["目前庫存"]), safety: num(p["安全庫存"]), photo: photo(p["品項照片"]) };
    }).sort((a, b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
    return { me: { ...d.me, onDuty: true, event: "" }, items, recent: S.recent || [] };
  },
  async resident(tag) {
    const d = await post({ a: "resident", tag });
    if (d.found !== "yes") return null;
    return { id: d.residentId, name: d.name, note: d.status, inShelter: d.tagStatus !== "失效" && d.status === "在所" };
  },
  async addItem(f) {
    const code = newCode();
    const d = await post({ a: "addItem", name: f.name, unit: f.unit, pack: f.pack || "", per: String(f.per || 1),
                           cat: f.cat || "其他", safety: String(f.safety || 0), code });
    return { id: d.itemId, code, name: f.name, cat: f.cat, unit: f.unit, pack: f.pack, per: f.per || 1, stock: 0, safety: f.safety || 0 };
  },
  async submit(requestId, lines) {
    const d = await post({ a: "submit", r: requestId, g: S.recip && S.recip.kind === "resident" ? S.recip.id : "",
                           u: S.recip && S.recip.kind === "public" ? "public" : "", w: recipName(),
                           l: JSON.stringify({ lines: lines.map(l => ({ ...l, name: S.items.find(x => x.id === l.itemId).name })) }) });
    if (d.duplicate) return { duplicate: true, results: [] };
    const now = new Date(), t = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    for (const l of lines) {
      const it = S.items.find(x => x.id === l.itemId);
      S.recent.unshift({ t, text: `${it.name} ${l.type} ${l.note}` + (l.type === "發放" && S.recip ? `・${recipName()}` : "") });
    }
    return { results: (d.results || []).map(r => ({ itemId: r.itemId, ok: true, stock: r.stock })) };
  },
  // 居民：號碼牌狀態（none 不是本所｜blank 空白牌｜used 使用中＋居民｜void 失效）
  async tagInfo(tag) { return await post({ a: "tagInfo", tag }); },
  async register(f) { return await post({ a: "register", ...f }); },
  async move(tag, kind, hours) { return await post({ a: "move", tag, kind, hours: String(hours || "") }); },
  // 本所：status 狀況｜report 記錄事件｜update 認領・追加紀錄・解決｜prep 整備回報｜prepDone 送出整備完成
  async ops(a, f) { return await post({ a, ...(f || {}) }, CONFIG.opsUrl); },

  }

    return false;

}

function fmtTime(iso) {

}

async function loadResident(tag) {
  S.view = "resident"; S.rtag = tag; S.rinfo = null; S.rform = null; S.rmsg = ""; render();
  try {
    const d = await api.tagInfo(tag);
    S.rinfo = d; S.me = { ...(S.me || {}), name: d.staff, role: d.role, opening: d.opening, onDuty: true, event: (S.me && S.me.event) || "" };
  } catch (e) { if (handleApiError(e)) return; S.rmsg = "網路不穩，沒讀到號碼牌。請按下方「掃描」再掃一次。"; }
  render();
}
async function residentAction(kind, hours) {
  if (S.busy) return;
  if (kind === "離所" && !confirm(`確定 ${S.rinfo.resident.name || S.rtag} 要離所嗎？\n離所後號碼牌會失效，不能再用。`)) return;
  S.busy = true; S.rmsg = ""; render();
  try {
    const d = await api.move(S.rtag, kind, hours);
    S.rinfo.resident.status = d.status;
    if (kind === "外出") S.rinfo.resident.back = new Date(Date.now() + hours * 3600e3).toISOString();
    if (kind === "離所") S.rinfo.state = "void";
    const who = S.rinfo.resident.name || S.rtag;   // 志工看不到姓名，用號碼牌編號
    toast(kind === "離所" ? `${who} 已離所，號碼牌已回收` : `${who} ${kind === "外出" ? `已外出，預計 ${fmtTime(S.rinfo.resident.back)} 返回` : "已返回"}`);
  } catch (e) {
    if (e.code === "bad_state") { toast("狀態已被其他人更新，已重新讀取"); S.busy = false; return loadResident(S.rtag); }
    if (e.code === "no_permission") toast("進出登記限管理者、門禁組、志工");
    else if (!handleApiError(e)) toast("網路不穩，沒有送出，請再按一次");
  } finally { S.busy = false; render(); }
}
async function doRegister() {
  const f = S.rform, err = m => { $("#f-err").textContent = m; };
  f.name = f.name.replace(/["\\]/g, "").trim();
  if (!f.name) return err("請填姓名");
  if (!f.age) return err("請選年齡層");
  if (f.id4 && !/^\d{4}$/.test(f.id4)) return err("身分證後四碼請填 4 位數字");

                         id4: f.noId ? "" : f.id4, verify: f.noId ? "待補查" : "不需查核", note: f.note.trim(), area: f.area.trim() });
    const name = f.name; S.busy = false;
    await loadResident(S.rtag); toast(`✅ ${name} 報到完成`);
  } catch (e) {
    S.busy = false;
    if (e.code === "tag_unusable") { toast("這張號碼牌已經被使用，已重新讀取"); return loadResident(S.rtag); }
    if (e.code === "not_open") toast("本所尚未開放報到");
    else if (e.code === "no_permission") toast("報到限管理者或門禁組");

}

// ===== 操作 =====
function setQty(id, qty, keepFocus) {
  const it = S.items.find(x => x.id === id);
  const p = S.pick[id] || { qty: "", unit: it.unit };
  p.qty = qty === "" ? "" : Math.max(0, parseInt(qty, 10) || 0);
  S.pick[id] = p; delete S.errs[id];
  if (keepFocus) renderBar(); else render();
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode && !b.disabled) {
    if (b.dataset.mode !== S.mode && Object.keys(S.pick).length && !confirm("切換模式會清除已填的數量，確定嗎？")) return;
    if (b.dataset.mode !== S.mode) { S.pick = {}; S.errs = {}; }
    S.mode = b.dataset.mode; render();
  }
  else if (b.dataset.cat) { S.cat = b.dataset.cat; render(); }
  else if (b.dataset.step) {
    const id = b.dataset.id, cur = (S.pick[id] && S.pick[id].qty) || 0;
    setQty(id, Math.max(0, (+cur) + (+b.dataset.step)));
  }
  else if (b.id === "showall") { S.showAll = true; render(); }
  else if (b.id === "reload") { await boot(); toast("已更新庫存"); }
  else if (b.id === "scan" || b.id === "rscan") scan();
  else if (b.dataset.tab) {
    const t = b.dataset.tab;
    if (t === "supply") toSupply();
    else if (t === "ops") { if (S.ops) { S.view = "ops"; render(); } else loadOps(); }
    else { S.view = "resident"; render(); }
  }
  else if (b.id === "opsReload") loadOps();
  else if (b.dataset.show !== undefined && b.dataset.show !== "") { S.opsShow = S.opsShow === b.dataset.show ? "" : b.dataset.show; render(); }
  else if (b.dataset.evt) eventSheet(b.dataset.evt);
  else if (b.dataset.prep) {
    const item = b.dataset.prep, result = b.dataset.res;
    if (result === "已完成") (async () => {
      // 這一項之前回報過「有問題」而且還沒結案的，一併標成已解決，待處理清單才不會留著
      for (const e of S.ops.events.filter(x => x.cat === "整備回報" && x.item === item && isOpen(x))) {
        try { await api.ops("update", { id: e.id, kind: "resolve", text: "整備項目已完成" }); } catch (x) {}
      }
      opsAct("prep", { item, result, text: "" }, `已回報：${item}完成`);
    })();
    else sheet(`<h2>${esc(item)}：有問題</h2><label>是什麼問題？<textarea id="pp-text" placeholder="例：2 樓緊急照明燈不亮"></textarea></label>
      <div class="acts"><button data-close>取消</button><button class="go" id="pp-ok">送出</button></div>`, root => {
      root.querySelector("#pp-ok").onclick = () => opsAct("prep", { item, result, text: root.querySelector("#pp-text").value.trim() }, `已回報：${item}有問題`);
    });
  }
  else if (b.id === "prepDone") { if (confirm("確定送出整備完成，申請開放進駐嗎？")) opsAct("prepDone", {}, "已送出，等社會處核准"); }
  else if (b.id === "doReport") { const r = S.rinfo.resident; S.reportRes = { id: r.id, name: r.name || S.rtag }; reportSheet(); }
  else if (b.id === "doSupply") { const r = S.rinfo.resident; toSupply({ kind: "resident", tag: S.rtag, id: r.id, name: r.name || S.rtag, note: r.status }); }
  else if (b.id === "doOut") { S.rmsg = S.rmsg === "pickHours" ? "" : "pickHours"; render(); }
  else if (b.dataset.hours) { S.rmsg = ""; residentAction("外出", +b.dataset.hours); }
  else if (b.id === "doBack") residentAction("返回");
  else if (b.id === "doLeave") residentAction("離所");
  else if (b.id === "doRegister") doRegister();
  else if (b.dataset.pick) {
    const k = b.dataset.pick, v = b.dataset.v, f = S.rform;
    if (k === "care") f.care = f.care.includes(v) ? f.care.filter(x => x !== v) : [...f.care, v]; else f[k] = v;
    render();
  }
  else if (b.id === "pub") { S.recip = { kind: "public" }; render(); toast("領取對象：公共用途"); }
  else if (b.id === "addnew") addItemSheet();
});
document.addEventListener("input", e => {
  if (S.rform && e.target.id && e.target.id.startsWith("f-") && e.target.id !== "f-noid" && document.querySelector(".form h2")) {
    S.rform[e.target.id.slice(2)] = e.target.value; return;
  }
  if (e.target.dataset.qty) setQty(e.target.dataset.qty, e.target.value, true);
  else if (e.target.id === "q") { S.q = e.target.value.trim(); const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.id === "f-noid") { S.rform.noId = e.target.checked; if (S.rform.noId) S.rform.id4 = ""; render(); return; }
  if (e.target.dataset.qty) render();
  if (e.target.dataset.unit) { const id = e.target.dataset.unit, it = S.items.find(x => x.id === id); S.pick[id] = { qty: (S.pick[id] && S.pick[id].qty) || "", unit: e.target.value || it.unit }; render(); }
});

async function scan() {
  let v;
  if (window.liff && liff.isInClient && liff.isInClient() && liff.isApiAvailable("scanCodeV2")) {
    try { v = (await liff.scanCodeV2()).value; } catch (e) { toast("無法開啟掃描器"); return; }
  } else {
    const codes = S.items.map(x => `${x.code} ${x.name}`).concat(REAL ? [] : Object.keys(mock.tags).map(k => `${k}（號碼牌）`)).join("\n");
    v = prompt(`（原型）輸入或貼上物資標籤或號碼牌代碼：\n${codes}`, (S.items[0] || {}).code || "MLS-W8AGZ");
  }
  if (!v) return;
  const tm = String(v).toUpperCase().match(/MLS-[A-Z0-9]{5}/);
  if (tm) return S.view === "supply" && S.mode === "out" ? pickResident(tm[0]) : loadResident(tm[0]);
  const m = String(v).toUpperCase().match(/SUP-[A-Z0-9]{5}/);
  if (m && S.view === "resident") { S.focusCode = m[0]; S.showAll = true; await toSupply(); }
  const code = m ? m[0] : "";
  if (S.view === "resident") return;
  const it = S.items.find(x => x.code === code);
  if (!it) { toast("這不是本所的物資標籤或居民號碼牌"); return; }
  if (!S.pick[it.id]) S.pick[it.id] = { qty: S.mode === "count" ? "" : 1, unit: it.unit };
  S.cat = "全部"; S.q = ""; render();
  const row = document.querySelector(`.row[data-id="${it.id}"]`); if (row) row.scrollIntoView({ block: "center" });
  toast(`已加入：${it.name}`);
}

// 掃到居民號碼牌：查居民，設為這次的領取人（取代上一位）。查不到或不在所就保留原本的
async function pickResident(tag) {
  if (S.mode !== "out") {
    if (lines().length && !confirm("掃到居民號碼牌，要切換到「發放」嗎？已填的數量會清除。")) return;
    S.pick = {}; S.errs = {}; S.mode = "out"; render();
  }
  let r;
  try { r = await api.resident(tag); }
  catch (e) { if (!handleApiError(e)) toast("網路不穩，沒查到號碼牌，請再掃一次"); return; }
  if (!r) { toast(`查無號碼牌 ${tag}` + (S.recip ? "，領取人沒有更換" : "")); return; }
  if (!r.inShelter) { toast(`${r.name}（${tag}）目前「${r.note}」，不能領物資` + (S.recip ? "，領取人沒有更換" : "")); return; }
  const changed = S.recip && S.recip.kind === "resident" && S.recip.tag !== tag;
  S.recip = { kind: "resident", tag, ...r };
  render(); toast(changed ? `領取人改為 ${r.name}` : `領取人：${r.name}`);
}

$("#go").addEventListener("click", () => {
  if (S.view === "resident") { scan(); return; }
  if (S.view === "ops") { S.reportRes = null; reportSheet(); return; }
  const ls = lines(); if (!ls.length || S.busy) return;
  if (S.mode === "out" && !S.recip) { scan(); return; }
  const label = S.mode === "count" ? "盤點" : MODES[S.mode];
  sheet(`<h2>確認${label}${S.mode === "out" ? esc(toWho()) : ""}</h2>
    ${ls.map(l => `<div class="line"><span>${esc(l.it.name)}</span><span>${esc(l.note)}${l.p.unit === l.it.pack && S.mode !== "count" ? ` <small>＝${l.qty} ${esc(l.it.unit)}</small>` : ""}</span></div>`).join("")}
    <div class="acts"><button data-close>返回修改</button><button class="go" id="doit">確認${label}</button></div>`, root => {
    root.querySelector("#doit").onclick = () => { closeSheet(); submit(ls); };
  });
});

async function submit(ls) {
  const over = ls.filter(l => l.type === "發放" && l.qty > l.it.stock);
  if (over.length) {
    for (const l of over) S.errs[l.it.id] = `庫存只剩 ${l.it.stock} ${l.it.unit}，請確認數量`;
    toast("有品項超過庫存，請看紅字"); render(); return;
  }
  S.busy = true; renderBar();
  const requestId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
  try {
    const res = await api.submit(requestId, ls.map(l => ({ itemId: l.it.id, type: l.type, qty: l.qty, note: l.note })));
    if (res.duplicate) { toast("這筆已經登記過了"); return; }
    let ok = 0, bad = 0;
    for (const r of res.results) {
      const it = S.items.find(x => x.id === r.itemId);
      if (r.ok) { ok++; it.stock = r.stock; delete S.pick[r.itemId]; delete S.errs[r.itemId];
        if (r.stock < 0) S.errs[r.itemId] = "⚠ 庫存變成負數，可能有人同時發放，請盤點確認"; }
      else { bad++; S.errs[r.itemId] = r.error; }
    }
    if (!REAL) { const d = await api.load(); S.recent = d.recent; }
    const who = S.mode === "out" ? recipName() : "";
    if (S.mode === "out" && !bad) S.recip = null;   // 發完換下一位，避免記到上一位身上
    if (who && !bad && S.rinfo && S.rinfo.resident && S.rinfo.resident.name === who) { S.view = "resident"; }
    toast(bad ? `${ok} 項已登記，${bad} 項未登記，請看紅字` : `已登記 ${ok} 項` + (who ? `（${who}）` : ""));
  } catch (err) {
    if (err.code === "no_recipient") toast("發放要先掃領取人號碼牌，或選公共用途");
    else if (!handleApiError(err)) toast("網路不穩，沒有送出。請再按一次確認（不會重複登記）。");
  } finally { S.busy = false; render(); }
}

function addItemSheet() {
  sheet(`<h2>新增品項</h2>
    <label>品名<input id="f-name" placeholder="例：牙刷"></label>
    <label>類別<select id="f-cat">${["飲用水", "食品", "寢具", "衛生用品", "醫療", "防寒", "其他"].map(c => `<option>${c}</option>`).join("")}</select></label>
    <label>最小單位<input id="f-unit" placeholder="例：支"></label>
    <label>包裝單位（可空白）<input id="f-pack" placeholder="例：盒"></label>
    <label>每包裝數量<input id="f-per" inputmode="numeric" placeholder="例：20"></label>
    <label>安全庫存<input id="f-safety" inputmode="numeric" placeholder="例：30"></label>
    <div class="err" id="f-err"></div>
    <div class="acts"><button data-close>取消</button><button class="go" id="f-ok" style="background:var(--green)">新增</button></div>`, root => {
    root.querySelector("#f-ok").onclick = async () => {
      const v = id => root.querySelector(id).value.trim();
      if (!v("#f-name") || !v("#f-unit")) { root.querySelector("#f-err").textContent = "品名和最小單位一定要填"; return; }
      if (S.items.some(x => x.name === v("#f-name"))) { root.querySelector("#f-err").textContent = "本所已經有這個品項"; return; }
      let it;
      const okBtn = root.querySelector("#f-ok"); okBtn.disabled = true; okBtn.textContent = "新增中…";
      try { it = await api.addItem({ name: v("#f-name"), cat: v("#f-cat"), unit: v("#f-unit"), pack: v("#f-pack"), per: +v("#f-per") || 1, safety: +v("#f-safety") || 0 }); }
      catch (e) { okBtn.disabled = false; okBtn.textContent = "新增"; root.querySelector("#f-err").textContent = e.code === "not_manager" ? "只有收容所管理者可以新增品項" : "沒有新增成功，請再試一次"; return; }
      S.items = (await api.load()).items;
      if (!S.items.some(x => x.id === it.id)) S.items.push(it);   // Notion 搜尋偶爾慢一步，先放進清單
      closeSheet();
      S.mode = "in"; S.pick = { [it.id]: { qty: "", unit: it.unit } }; S.cat = "全部"; render();
      toast(`已新增「${it.name}」，現在可以入庫`);
    };
  });
}

function sheet(html, onMount) {
  closeSheet();
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-close]")) closeSheet(); });
  document.body.append(bg); onMount && onMount(bg);
}
function closeSheet() { const s = $("#sheet"); if (s) s.remove(); }

// ===== 原型示範切換（正式版移除） =====
function demoBar() {
  const base = location.pathname, links = [["一般進入", ""], ["掃物資標籤", "?item=SUP-7K2QX"], ["掃號碼牌（在所）", "?r=MLS-W8AGZ"], ["掃號碼牌（外出）", "?r=MLS-K7PQ2"], ["空白牌報到", "?r=MLS-NEW01"], ["失效牌", "?r=MLS-RXKK3"], ["本所", "?v=ops"], ["本所（整備中）", "?v=ops&stage=整備中"], ["非工作人員", "?as=guest"]];
  $("#demo").innerHTML = `原型示範：` + links.map(([t, q]) => `<button onclick="location.href='${base}${q}'">${t}</button>`).join("");
}

async function initLiff() {
  if (!CONFIG.liffId || !IN_LIFF_HOST || !window.liff) return null;
  await liff.init({ liffId: CONFIG.liffId });
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return null; }
  try { return await liff.getProfile(); } catch (e) { return null; }
}
let PROFILE = null;
// 驗證失敗就重新登入；不在班就顯示限制畫面。處理過回傳 true
function handleApiError(e) {
  if (!(e instanceof ApiError)) return false;
  if (e.code === "auth" || e.code === "no_token") {
    // 只自動重新登入一次；兩分鐘內又失敗就停下來顯示原因，避免無限重新整理、一直消耗 Make 額度
    let last = 0;
    try { last = +sessionStorage.getItem("relogin") || 0; } catch (x) {}
    if (e.code === "auth" && Date.now() - last > 120000) {
      try { sessionStorage.setItem("relogin", String(Date.now())); } catch (x) {}
      if (liff.isInClient()) location.reload(); else { liff.logout(); liff.login({ redirectUri: location.href }); }
      return true;
    }
    showAuthProblem(e.code); return true;
  }
  if (e.code === "not_on_duty") { S.me = { ...(S.me || {}), onDuty: false }; render(); return true; }
  return false;
}
function showAuthProblem(code) {
  let info = "";
  try {
    const d = liff.getDecodedIDToken();
    if (d) info = `頻道 ${d.aud}，ID Token 到期 ${new Date(d.exp * 1000).toLocaleString("zh-TW")}，現在 ${new Date().toLocaleString("zh-TW")}，Access Token ${liff.getAccessToken() ? "有" : "無"}`;
  } catch (x) {}
  const why = code === "no_token" ? "LINE 沒有提供身分憑證。請關閉頁面，從 LINE 重新開啟。"
                                  : "LINE 身分驗證沒有通過。";
  $("#bar").hidden = true;
  $("#app").innerHTML = `<div class="blocked"><h2>無法確認您的身分</h2><p>${esc(why)}</p>
    <p style="margin-top:12px;font-size:13px">請截圖給管理者。${esc(info || "沒有取得憑證內容")}（${esc(code)}）</p></div>`;
}
async function boot() {
  if (S.view === "ops" && !S.items.length) return loadOps();
  if (S.view === "resident" && !S.items.length) return loadResident(S.rtag);
  let d;
  try { d = await api.load(); }
  catch (e) { if (!handleApiError(e)) { S.me = null; $("#app").innerHTML = `<div class="blocked"><h2>暫時無法讀取庫存</h2><p>請稍後按重新整理，或改用聊天室打字登記（例：飲用水+20）。</p></div>`; } return; }
  S.me = d.me; S.items = d.items; S.recent = d.recent;
  if (PROFILE && !REAL) S.me = { ...S.me, name: PROFILE.displayName };  // 原型：經手人顯示目前 LINE 帳號的名字
  if (S.tag && !S.tagDone) {   // 只在第一次載入時帶入；之後按重新整理不會把發完的人又設回來
    S.tagDone = true;
    const r = await api.resident(S.tag);
    if (!r) toast("查無此號碼牌");
    else if (!r.inShelter) toast("此號碼牌已失效，不能領物資");
    else S.recip = { kind: "resident", tag: S.tag, ...r };
  }
  if (S.focusCode && !S.items.some(x => x.code === S.focusCode)) { toast("這不是本所的物資標籤"); S.focusCode = null; S.showAll = true; }
  render();
}
render();
initLiff().then(p => {
  PROFILE = p;
  if (p && CONFIG.apiUrl) { api = real; REAL = true; S.recent = []; } else demoBar();
  return boot();
}).catch(e => { toast("LINE 登入失敗：" + e.message); boot(); });
</script>
